name: Mobile preview

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Android installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      - name: Build installable preview APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Prepare release files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Invite-1.0.0-preview.1.apk
          sha256sum Invite-1.0.0-preview.1.apk > Invite-1.0.0-preview.1.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: invite-android-preview
          path: |
            Invite-1.0.0-preview.1.apk
            Invite-1.0.0-preview.1.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.0-preview.1
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              Invite-1.0.0-preview.1.apk \
              Invite-1.0.0-preview.1.apk.sha256 \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              Invite-1.0.0-preview.1.apk \
              Invite-1.0.0-preview.1.apk.sha256 \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Invite 1.0.0 preview 1" \
              --notes "Installable Android preview for direct device testing. Development-signed; not intended for Play Store submission. Verify the APK against the attached SHA-256 checksum before installation."
