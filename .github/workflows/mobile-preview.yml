name: Mobile preview

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Android installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.INVITE_API_URL || 'https://invite-someone-api.onrender.com' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      - name: Build standalone preview APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify embedded JavaScript bundle
        run: |
          unzip -Z1 android/app/build/outputs/apk/release/app-release.apk \
            | grep -Fxq 'assets/index.android.bundle'

      - name: Prepare release files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Invite-1.0.0-preview.4.apk
          sha256sum Invite-1.0.0-preview.4.apk > Invite-1.0.0-preview.4.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: invite-android-preview-4
          path: |
            Invite-1.0.0-preview.4.apk
            Invite-1.0.0-preview.4.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.0-preview.4
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              Invite-1.0.0-preview.4.apk \
              Invite-1.0.0-preview.4.apk.sha256 \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              Invite-1.0.0-preview.4.apk \
              Invite-1.0.0-preview.4.apk.sha256 \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Invite 1.0.0 preview 4" \
              --notes "Standalone Android preview connected to the live MongoDB-backed Invite API, with profile photos, advanced people filters, an approximate-area map, and invitations. Its JavaScript bundle is embedded, so no Metro development server is required. Development-signed and intended for direct device testing, not Play Store submission. Verify the APK against the attached SHA-256 checksum before installation."
          fi
