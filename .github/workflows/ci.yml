name: CI

on:
  pull_request:
  push:
    branches: [main, 'impl/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test user stories
        run: npm run test:ci

      - name: Validate MVP story traceability
        run: npm run validate:mvp

      - name: Verify production web bundle
        run: npm run export:web -- --output-dir dist

  api-integration:
    name: MongoDB API integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      AUTH_MODE: internal
      JWT_SECRET: invite-ci-integration-secret-at-least-32-characters
      MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DB_NAME: invite_ci_test
      RUN_API_INTEGRATION: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start MongoDB replica set
        run: |
          docker run --detach --name invite-mongo --publish 27017:27017 \
            mongo:8.0 --replSet rs0 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec invite-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs invite-mongo
              exit 1
            fi
            sleep 2
          done
          docker exec invite-mongo mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in {1..30}; do
            if docker exec invite-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
              exit 0
            fi
            sleep 2
          done
          docker logs invite-mongo
          exit 1
      - name: Run API integration suite
        run: npm run test:api-integration
      - name: Upload MongoDB logs on failure
        if: failure()
        run: docker logs invite-mongo > mongodb-integration.log 2>&1 || true
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-integration-${{ github.run_id }}
          path: mongodb-integration.log
          if-no-files-found: ignore
          retention-days: 14
