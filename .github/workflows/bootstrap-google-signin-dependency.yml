name: Bootstrap native Google sign-in dependency

on:
  push:
    branches: ['impl/firebase-auth']
    paths:
      - '.github/workflows/bootstrap-google-signin-dependency.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/firebase-auth
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
      - run: npm install react-native-nitro-google-signin@2.1.0 react-native-nitro-modules@0.37.1 --save
      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "chore: add native Google sign-in dependencies"
          git push origin HEAD:impl/firebase-auth
