name: Fix Firebase signup lint

on:
  push:
    branches: ['impl/firebase-auth']
    paths:
      - '.github/workflows/fix-firebase-signup-lint.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/firebase-auth
          fetch-depth: 0
      - name: Patch onboarding lint issues
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/(auth)/sign-up.tsx')
          s = p.read_text()
          replacements = {
            "const [checkingProfile, setCheckingProfile] = useState(false);": "const [profileCheckComplete, setProfileCheckComplete] = useState(false);",
            "    setCheckingProfile(true);\n": "",
            "        if (active) setCheckingProfile(false);": "        if (active) setProfileCheckComplete(true);",
            "const useDifferentAccount = async () => {": "const switchAccount = async () => {",
            "void useDifferentAccount()": "void switchAccount()",
            "if (!identityLoaded || checkingProfile) {": "if (!identityLoaded || (identitySignedIn && emailVerified && !profileCheckComplete)) {",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected text: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/(auth)/sign-up.tsx'
          git commit -m "fix: satisfy Firebase onboarding lint rules"
          git pull --rebase origin impl/firebase-auth
          git push origin HEAD:impl/firebase-auth
