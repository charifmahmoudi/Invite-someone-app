name: Bootstrap Firebase dependency

on:
  push:
    branches: [impl/firebase-auth]
    paths:
      - .github/workflows/bootstrap-firebase-dependency.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: impl/firebase-auth
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
      - name: Install Firebase SDK
        run: npm install firebase
      - name: Commit dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: add Firebase SDK"
          git push origin HEAD:impl/firebase-auth
