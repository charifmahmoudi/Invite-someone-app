name: MVP Evidence

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'evidence/**'
      - '.maestro/**'
      - 'scripts/validate-mvp-evidence.mjs'
      - '.github/workflows/mvp-evidence.yml'
      - 'package.json'
  push:
    branches: [main, 'impl/**', 'chore/**']
    paths:
      - 'docs/**'
      - 'evidence/**'
      - '.maestro/**'
      - 'scripts/validate-mvp-evidence.mjs'
      - '.github/workflows/mvp-evidence.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvp-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  traceability:
    name: Validate story traceability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - name: Validate MVP evidence manifest
        run: node scripts/validate-mvp-evidence.mjs
