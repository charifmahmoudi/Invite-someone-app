name: Android E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/e2e-android.yml'
      - '.maestro/**'
      - 'app.json'
      - 'package-lock.json'
      - 'package.json'
      - 'server/**'
      - 'src/**'

permissions:
  contents: read

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Internal-auth compatibility smoke
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      EXPO_PUBLIC_API_URL: http://10.0.2.2:4000
      E2E_EMAIL: demo@invite.app
      E2E_PASSWORD: invite-demo
      E2E_FIXTURES_TOKEN: invite-android-e2e-fixture-token-2026
      NODE_ENV: test
      AUTH_MODE: internal
      JWT_SECRET: invite-android-e2e-jwt-secret-2026-change
      MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DB_NAME: invite_android_e2e
      # Index creation is exercised by the API integration job. Keeping it out of
      # this process makes the emulator job's HTTP readiness deterministic.
      MONGODB_ENSURE_INDEXES_ON_START: 'false'
      E2E_FIXTURES_ENABLED: 'true'
      PORT: '4000'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Start disposable MongoDB replica set
        run: |
          docker run --detach --name invite-android-e2e-mongo \
            --publish 27017:27017 \
            mongo:8.0 --replSet rs0 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec invite-android-e2e-mongo mongosh --quiet --eval \
              'db.adminCommand({ ping: 1 })' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec invite-android-e2e-mongo mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in {1..30}; do
            if docker exec invite-android-e2e-mongo mongosh --quiet --eval \
              'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB replica set did not become writable."
          exit 1

      - name: Start isolated Invite API
        run: |
          npm run server:start > /tmp/invite-e2e-api.log 2>&1 &
          for attempt in {1..90}; do
            if curl --fail --silent --connect-timeout 2 --max-time 5 \
              http://127.0.0.1:4000/v1/e2e/ready \
              -H "Authorization: Bearer $E2E_FIXTURES_TOKEN" >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          cat /tmp/invite-e2e-api.log
          exit 1

      - name: Reset deterministic E2E fixtures
        run: bash scripts/reset-e2e-fixtures.sh

      - name: Generate Android project
        run: |
          npx expo prebuild --platform android --no-install
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' \
            android/app/src/main/AndroidManifest.xml
        env:
          CI: '1'
          NODE_ENV: production

      - name: Build E2E APK
        working-directory: android
        run: |
          chmod +x gradlew
          EXPO_PUBLIC_API_URL="$EXPO_PUBLIC_API_URL" ./gradlew :app:assembleRelease --no-daemon
        env:
          NODE_ENV: production

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm -a -w /dev/kvm

      - name: Run emulator smoke flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on
          script: |
            adb reverse tcp:4000 tcp:4000
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            "$HOME/.maestro/bin/maestro" test -e E2E_EMAIL="$E2E_EMAIL" -e E2E_PASSWORD="$E2E_PASSWORD" .maestro/auth

      - name: Upload Maestro evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-e2e-${{ github.run_id }}
          path: |
            ~/.maestro/tests
            evidence/US-01
            evidence/US-02
            evidence/US-13
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload isolated API logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: invite-e2e-api-logs-${{ github.run_id }}
          path: /tmp/invite-e2e-api.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve MongoDB logs on failure
        if: failure()
        run: docker logs invite-android-e2e-mongo > /tmp/invite-e2e-mongodb.log 2>&1 || true

      - name: Upload MongoDB logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: invite-e2e-mongodb-logs-${{ github.run_id }}
          path: /tmp/invite-e2e-mongodb.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop disposable MongoDB
        if: always()
        run: docker rm --force invite-android-e2e-mongo || true
