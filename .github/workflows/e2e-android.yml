name: Android E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/e2e-android.yml'
      - '.maestro/**'
      - 'app.json'
      - 'package-lock.json'
      - 'package.json'
      - 'scripts/**'
      - 'server/**'
      - 'src/**'

permissions:
  contents: read

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_API_URL: http://127.0.0.1:4000
  EXPO_PUBLIC_E2E_DIAGNOSTICS: 'true'
  E2E_EMAIL: demo@invite.app
  E2E_PASSWORD: invite-demo
  E2E_FIXTURES_TOKEN: invite-android-e2e-fixture-token-2026
  NODE_ENV: test
  AUTH_MODE: internal
  JWT_SECRET: invite-android-e2e-jwt-secret-2026-change
  MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
  MONGODB_DB_NAME: invite_android_e2e
  MONGODB_ENSURE_INDEXES_ON_START: 'false'
  E2E_FIXTURES_ENABLED: 'true'
  PORT: '4000'

jobs:
  build:
    name: Build Android evidence APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      - name: Generate Android project
        run: |
          npx expo prebuild --platform android --no-install
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' \
            android/app/src/main/AndroidManifest.xml
        env:
          CI: '1'
          NODE_ENV: production
      - name: Build E2E APK
        working-directory: android
        run: |
          chmod +x gradlew
          EXPO_PUBLIC_API_URL=http://127.0.0.1:4000 ./gradlew :app:assembleRelease \\
            --no-daemon \\
            --max-workers=2 \\
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
        env:
          NODE_ENV: production
      - name: Upload E2E APK
        uses: actions/upload-artifact@v4
        with:
          name: invite-e2e-apk-${{ github.run_id }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 2

  story:
    name: ${{ matrix.case }} · ${{ matrix.story }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { case: activity-creation, story: US-04, flow: .maestro/activities/activity-creation.yaml }
          - { case: activity-join, story: US-07, flow: .maestro/activities/activity-join.yaml }
          - { case: activity-trust, story: US-09, flow: .maestro/activities/activity-trust.yaml }
          - { case: person-profile, story: US-13, flow: .maestro/auth/person-profile.yaml }
          - { case: profile-edit, story: US-02, flow: .maestro/auth/profile-edit.yaml }
          - { case: registration, story: US-01, flow: .maestro/auth/registration-validation.yaml }
          - { case: sign-in, story: US-01, flow: .maestro/auth/sign-in-internal.yaml }
          - { case: people-filters, story: US-11, flow: .maestro/discovery/people-filters.yaml }
          - { case: people-map, story: US-12, flow: .maestro/discovery/people-map.yaml }
          - { case: people-search, story: US-03, flow: .maestro/discovery/people-search.yaml }
          - { case: invite-decisions, story: US-06, flow: .maestro/invitations/invite-decisions.yaml }
          - { case: invite-send, story: US-05, flow: .maestro/invitations/invite-send.yaml }
          - { case: safety-guidance, story: US-10, flow: .maestro/safety/safety-guidance.yaml }
          - { case: saved-activities, story: US-08, flow: .maestro/safety/saved-activities.yaml }
    env:
      MAESTRO_FLOW: ${{ matrix.flow }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      - name: Download E2E APK
        uses: actions/download-artifact@v4
        with:
          name: invite-e2e-apk-${{ github.run_id }}
          path: android-e2e
      - name: Start disposable MongoDB replica set
        run: |
          docker run --detach --name invite-android-e2e-mongo \
            --publish 27017:27017 \
            mongo:8.0 --replSet rs0 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec invite-android-e2e-mongo mongosh --quiet --eval \
              'db.adminCommand({ ping: 1 })' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec invite-android-e2e-mongo mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in {1..30}; do
            if docker exec invite-android-e2e-mongo mongosh --quiet --eval \
              'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB replica set did not become writable."
          exit 1
      - name: Start isolated Invite API
        run: |
          npm run server:start > /tmp/invite-e2e-api.log 2>&1 &
          for attempt in {1..90}; do
            if curl --fail --silent --connect-timeout 2 --max-time 5 \
              http://127.0.0.1:4000/v1/e2e/ready \
              -H "Authorization: Bearer $E2E_FIXTURES_TOKEN" >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          cat /tmp/invite-e2e-api.log
          exit 1
      - name: Reset deterministic E2E fixtures
        run: bash scripts/reset-e2e-fixtures.sh
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Enable emulator acceleration when available
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if test -r /dev/kvm -a -w /dev/kvm; then
            echo 'KVM is available.'
          else
            echo 'KVM is unavailable; this isolated flow will use software acceleration.'
          fi
      - name: Run isolated story flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb reverse tcp:4000 tcp:4000
            adb install -r android-e2e/app-release.apk
            bash scripts/run-maestro-flows.sh
      - name: Upload story evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-evidence-${{ matrix.case }}-${{ github.run_id }}
          path: |
            ~/.maestro/tests
            evidence/${{ matrix.story }}
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve service logs on failure
        if: failure()
        run: |
          cp /tmp/invite-e2e-api.log /tmp/invite-e2e-api-${{ matrix.case }}.log 2>/dev/null || true
          docker logs invite-android-e2e-mongo > /tmp/invite-e2e-mongo-${{ matrix.case }}.log 2>&1 || true
      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-service-logs-${{ matrix.case }}-${{ github.run_id }}
          path: |
            /tmp/invite-e2e-api-${{ matrix.case }}.log
            /tmp/invite-e2e-mongo-${{ matrix.case }}.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop disposable MongoDB
        if: always()
        run: docker rm --force invite-android-e2e-mongo || true
