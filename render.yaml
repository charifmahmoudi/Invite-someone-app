services:
  - type: web
    name: invite-someone-api
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci
    startCommand: npm run server:start
    initialDeployHook: npm run server:seed
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: invite_someone
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '*'
      - key: GEOCODING_BASE_URL
        value: https://nominatim.openstreetmap.org/
      - key: GEOCODING_USER_AGENT
        value: InviteSomeone/1.0 (+https://github.com/charifmahmoudi/Invite-someone-app)
