appId: com.charifmahmoudi.invite
name: US-12 approximate people map and privacy disclosure
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element:
      id: welcome-sign-in
    direction: DOWN
- tapOn:
    id: welcome-sign-in
- tapOn:
    id: auth-email
- inputText: ${E2E_EMAIL}
- tapOn:
    id: auth-password
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn:
    id: auth-submit
- extendedWaitUntil:
    visible:
      text: "People worth inviting"
    timeout: 60000
- tapOn:
    point: "38%, 95%"
- tapOn: Map
- assertVisible: Approximate map of matching people
- assertVisible: Pins represent broad neighbourhood areas—not exact locations.
- takeScreenshot: evidence/US-12/01-approximate-map
- tapOn: Open Jonas's profile near Prenzlauer Berg
- assertVisible:
    id: person-profile-summary
- takeScreenshot: evidence/US-12/02-map-profile
