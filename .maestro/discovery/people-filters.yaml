appId: com.charifmahmoudi.invite
name: US-11 combined filters and recovery
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element:
      id: welcome-sign-in
    direction: DOWN
- tapOn:
    id: welcome-sign-in
- tapOn:
    id: auth-email
- inputText: ${E2E_EMAIL}
- tapOn:
    id: auth-password
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn:
    id: auth-submit
- extendedWaitUntil:
    visible:
      text: "What sounds good?"
    timeout: 60000
- tapOn:
    point: "38%, 95%"
- extendedWaitUntil:
    visible:
      text: "People worth inviting"
    timeout: 30000
- tapOn: Filters
- tapOn: Outdoors
- tapOn: Saturday
- tapOn: Activity buddies
- assertVisible: 1 person
- takeScreenshot: evidence/US-11/01-combined-filters
- tapOn: Search
- inputText: no-match-for-invite
- assertVisible: No matching people yet
- takeScreenshot: evidence/US-11/02-no-results
- tapOn: Clear filters
- assertVisible: People worth inviting
- takeScreenshot: evidence/US-11/03-filters-cleared
