appId: com.charifmahmoudi.invite
name: US-03 people search and recommendation reasons
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element:
      id: welcome-sign-in
    direction: DOWN
- tapOn:
    id: welcome-sign-in
- tapOn:
    id: auth-email
- inputText: ${E2E_EMAIL}
- tapOn:
    id: auth-password
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn:
    id: auth-submit
- extendedWaitUntil:
    visible:
      text: "What sounds good?"
    timeout: 60000
- tapOn:
    point: "38%, 95%"
- extendedWaitUntil:
    visible:
      text: "People worth inviting"
    timeout: 30000
- assertVisible:
    id: people-search
- tapOn:
    id: people-search
- inputText: Jonas
- assertVisible:
    id: profile-card-profile-jonas
- assertVisible: 3 shared interests
- takeScreenshot: evidence/US-03/01-people-search
