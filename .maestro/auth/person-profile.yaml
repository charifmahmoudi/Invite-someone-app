appId: com.charifmahmoudi.invite
name: US-13 profile trust context and invitation eligibility
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element:
      id: welcome-sign-in
    direction: DOWN
- tapOn:
    id: welcome-sign-in
- tapOn:
    id: auth-email
- inputText: ${E2E_EMAIL}
- tapOn:
    id: auth-password
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn:
    id: auth-submit
- extendedWaitUntil:
    visible:
      id: people-screen
    timeout: 60000
- tapOn:
    id: tab-people
- assertVisible:
    id: profile-card-profile-jonas
- takeScreenshot: evidence/US-13/01-avatar-fallback
- tapOn:
    id: profile-card-profile-jonas
- assertVisible:
    id: person-profile-summary
- assertVisible: 2 shared interests
- assertVisible: Invite to one of my plans
- takeScreenshot: evidence/US-13/02-person-profile
- back
- tapOn:
    id: profile-card-profile-sofia
- assertVisible:
    id: person-profile-summary
- assertVisible: Create a plan first, then send a thoughtful invitation.
- takeScreenshot: evidence/US-13/03-invite-unavailable
