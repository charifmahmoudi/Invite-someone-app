appId: com.charifmahmoudi.invite
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: welcome-screen
    timeout: 60000
- scrollUntilVisible:
    element:
      id: welcome-sign-in
    direction: DOWN
- tapOn:
    id: welcome-sign-in
- assertVisible:
    id: auth-sign-in-screen
- tapOn:
    id: auth-email
- inputText: ${E2E_EMAIL}
- tapOn:
    id: auth-password
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn:
    id: auth-submit
- extendedWaitUntil:
    visible:
      text: "What sounds good?"
    timeout: 60000
