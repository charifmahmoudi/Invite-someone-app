appId: com.charifmahmoudi.invite
name: US-04 activity validation and creation form
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element:
      id: welcome-sign-in
    direction: DOWN
- tapOn:
    id: welcome-sign-in
- tapOn:
    id: auth-email
- inputText: ${E2E_EMAIL}
- tapOn:
    id: auth-password
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn:
    id: auth-submit
- extendedWaitUntil:
    visible:
      id: plans-screen
    timeout: 60000
- tapOn: Create
- assertVisible: Create an activity
- scrollUntilVisible:
    element:
      id: activity-create-submit
    direction: DOWN
- tapOn:
    id: activity-create-submit
- assertVisible: Title must be at least 4 characters.
- takeScreenshot: evidence/US-04/01-activity-validation
