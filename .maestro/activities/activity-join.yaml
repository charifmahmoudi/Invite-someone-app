appId: com.charifmahmoudi.invite
name: US-07 community activity joining
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element:
      id: welcome-sign-in
    direction: DOWN
- tapOn:
    id: welcome-sign-in
- tapOn:
    id: auth-email
- inputText: ${E2E_EMAIL}
- tapOn:
    id: auth-password
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn:
    id: auth-submit
- extendedWaitUntil:
    visible:
      text: "What sounds good?"
    timeout: 60000
- tapOn:
    point: "12%, 95%"
- assertVisible: Canal walk & coffee
- tapOn: Canal walk & coffee
- assertVisible: Join this activity
- tapOn: Join this activity
- assertVisible: You’re in
- takeScreenshot: evidence/US-07/01-joined-activity
