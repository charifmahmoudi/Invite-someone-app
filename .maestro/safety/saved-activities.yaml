appId: com.charifmahmoudi.invite
name: US-08 saved activity persistence
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element:
      id: welcome-sign-in
    direction: DOWN
- tapOn:
    id: welcome-sign-in
- tapOn:
    id: auth-email
- inputText: ${E2E_EMAIL}
- tapOn:
    id: auth-password
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn:
    id: auth-submit
- extendedWaitUntil:
    visible:
      text: "What sounds good?"
    timeout: 60000
- tapOn:
    point: "12%, 95%"
- tapOn: Low-stakes game night
- assertVisible:
    id: activity-save-toggle
- assertVisible: Save activity
- takeScreenshot: evidence/US-08/01-activity-unsaved
- tapOn:
    id: activity-save-toggle
- assertVisible: Remove from saved activities
- takeScreenshot: evidence/US-08/02-activity-saved
